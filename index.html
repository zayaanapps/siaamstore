<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#064E3B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Siaam Store" />
    <title>Siaam Store</title>
    <meta name="description" content="সিয়াম স্টোর (Siaam Store) — Ramchandrapur Hat, Chapainawabganj. Store management, POS, inventory, customer ledger, and role-based Admin & Account Manager vault." />
    <meta property="og:title" content="Siaam Store" />
    <meta property="og:description" content="সিয়াম স্টোর (Siaam Store) — Ramchandrapur Hat, Chapainawabganj. Store management, POS, inventory, customer ledger, and role-based Admin & Account Manager vault." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/assets/drawable/ic_siaam_store_logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      @keyframes preSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      html, body { margin: 0; padding: 0; background: #F4FAF8; }
      .pre-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #E9F7F3 0%, #F4FAF8 55%, #FFFFFF 100%);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      .pre-ring-wrap {
        position: relative;
        width: 126px;
        height: 126px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pre-ring {
        width: 126px;
        height: 126px;
        animation: preSpin 1.15s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      .pre-logo-frame {
        position: absolute;
        padding: 6px;
        border-radius: 24px;
        background: linear-gradient(135deg, #E6F8F0, #FFFFFF, #D1FAE5);
        border: 1px solid #A7F3D0;
        box-shadow: 0 12px 28px rgba(0, 150, 94, 0.18);
      }
      .pre-logo-box {
        width: 78px;
        height: 78px;
        border-radius: 18px;
        overflow: hidden;
        background: #1D3BB8;
      }
      .pre-logo-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.04);
      }
      .pre-title {
        margin-top: 24px;
        font-size: 20px;
        font-weight: 800;
        color: #064E3B;
        letter-spacing: -0.02em;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pre-splash">
        <div class="pre-ring-wrap">
          <svg class="pre-ring" viewBox="0 0 126 126" fill="none" aria-hidden="true">
            <circle cx="63" cy="63" r="57" stroke="#D1FAE5" stroke-width="3.5" />
            <circle cx="63" cy="63" r="57" stroke="#00965E" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="118 240" />
          </svg>
          <div class="pre-logo-frame">
            <div class="pre-logo-box">
              <img src="/assets/drawable/ic_siaam_store_logo.png" alt="Siaam Store" />
            </div>
          </div>
        </div>
        <div class="pre-title">সিয়াম স্টোর | Siaam Store</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
